<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sundial</title>
<meta name="description" content="Days, tasks, notes. A calendar and to-do app with day notes and reminders.">
<meta name="sundial-version" content="dev">
<meta name="theme-color" content="#0B0C0B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E4E5DA" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-128.png" sizes="128x128" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sundial">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand" title="The outer ring turns with the hour">
      <svg viewBox="0 0 28 28" aria-hidden="true" id="logo">
        <circle cx="14" cy="14" r="11.75" fill="var(--accent)" stroke="var(--on-accent)" stroke-width="1.5"/>
        <g class="ring h" id="shadow"><path d="M16.41 22.98A9.3 9.3 0 1 1 14.00 4.70" fill="none" stroke="var(--on-accent)" stroke-width="2.0" stroke-linecap="round"/></g>
        <g class="ring m"><path d="M11.34 19.71A6.3 6.3 0 0 1 14.00 7.70" fill="none" stroke="var(--on-accent)" stroke-width="2.0" stroke-linecap="round"/></g>
        <g class="ring s"><path d="M16.70 15.89A3.3 3.3 0 1 1 14.00 10.70" fill="none" stroke="var(--on-accent)" stroke-width="2.0" stroke-linecap="round"/></g>
        <circle cx="14" cy="14" r="1.5" fill="var(--on-accent)"/>
      </svg>
      <div><h1>Sundial</h1><small>DAYS · TASKS · NOTES</small></div>
    </div>
    <div class="title" id="title"></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="View">
      <button data-view="day" aria-pressed="true">Day</button>
      <button data-view="week" aria-pressed="false">Week</button>
      <button data-view="month" aria-pressed="false">Month</button>
      <button data-view="notes" aria-pressed="false">Notes</button>
    </div>
    <div class="seg icons" role="group" aria-label="Panes" id="paneSeg">
      <button data-pane="cal" title="Calendar pane  [">▦</button>
      <button data-pane="board" title="Board pane  \">☰</button>
      <button data-pane="tl" title="Timeline pane  ]">▤</button>
      <button id="layoutBtn" title="Stacked / side by side">⇅</button>
    </div>
    <button class="btn" id="todayBtn">Today<span class="kbd">T</span></button>
    <button class="btn icon" id="quickBtn" title="Quick add from anywhere" aria-label="Quick add">+</button>
    <button class="btn icon" id="searchBtn" title="Search  /" aria-label="Search">⌕</button>
    <button class="btn icon" id="settingsBtn" title="Settings, notifications, sounds, voice, data" aria-label="Settings">⋯</button>
  </header>

  <div class="cols" id="cols">
    <aside class="panel" id="calPane">
      <div class="pane-hd"><span class="eyebrow">Calendar</span><span class="hd-acts"><button class="lk" data-lock="cal" aria-label="Lock height"></button><button class="x" data-pane="cal" title="Hide pane">×</button></span></div>
      <div class="calwrap">
        <div class="mini">
          <div class="hd"><b id="miniTitle"></b><span class="nav"><button id="mPrev" aria-label="Previous month">‹</button><button id="mNext" aria-label="Next month">›</button></span></div>
          <div class="grid7" id="mini"></div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="upnext" id="upnext"></div>
      </div>
    </aside>
    <div class="gutter" data-side="l" id="gL"></div>
    <main class="panel" id="boardPane"></main>
    <div class="gutter" data-side="r" id="gR"></div>
    <aside class="panel" id="tlPane"></aside>
    <div class="gutter" data-side="b" id="gB"></div>
  </div>
  <div class="foot-tip" id="footTip"></div>
</div>

<script src="desktop.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="ai.js"></script>
<script src="sync.js"></script>
<script src="ui.js"></script>
</body>
</html>
