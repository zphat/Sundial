# Builds the Windows installer and the Linux bundles on every push to main (download them from the run's
# Artifacts), and publishes a GitHub Release with everything attached when a tag like v0.1.0 is pushed.
# The same release carries the sync server tarball and the web bundle (sundial-web.tar.gz), which
# the VPS installs on its own (server/ops/web). Every job waits for 'check' so a syntax error in
# ui/*.js can never ship through the auto-updater. The linux job waits for the windows job: both rewrite
# latest.json on the release through tauri-action (download, add own platform keys, upload again, no
# locking), so they must never run at the same time.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Third-party actions are pinned to commit SHAs (the comment names the version). A moving tag like @v2 lets
# whoever controls that repo run code in a job that can publish release assets, and the VPS installs the web
# bundle from the release unsigned (server/ops/web/README.md, "What the box trusts"). To move one: look up
# the new tag's commit, for example `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'`
# (without `^{}` for a lightweight tag), then change the SHA and the comment together. GitHub's own
# actions/* stay on their major tags.

jobs:
  # Syntax gate. The UI is plain files with no build step, so nothing else would notice a broken ui/*.js
  # before the auto-updater delivered it to every installed copy.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every ui/*.js
        shell: bash
        run: |
          set -euo pipefail
          for f in ui/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      # index.html loads the ui scripts as classic <script> tags, so they share one global scope: a top-level
      # let/const declared in two files throws "already been declared" at load and blanks the app, and
      # node --check of each file alone cannot see it. Parse them concatenated, in index.html's own order.
      - name: Parse the ui scripts as one shared scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -oE '<script src="[^"]+\.js"' ui/index.html | sed -E 's/^<script src="//; s/"$//')
          [ "${#files[@]}" -gt 0 ] || { echo '::error file=ui/index.html::no <script src> tags found'; exit 1; }
          echo "script order: ${files[*]}"
          node -e '
            const fs = require("fs");
            const body = process.argv.slice(1).map(f => fs.readFileSync("ui/" + f, "utf8")).join("\n;\n");
            new Function(body);
            console.log("shared scope ok");
          ' "${files[@]}"
      - name: Validate ui/manifest.webmanifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ui/manifest.webmanifest ]; then
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8")); print("manifest ok")' ui/manifest.webmanifest
          else
            echo "no ui/manifest.webmanifest, skipped"
          fi

  windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Updates are signed with src-tauri/updater.key, which is stored encrypted (see keygen.yml) and
      # unlocked with the TAURI_UPDATER_KEY_PASSWORD secret. Without both, the build still works but
      # produces no .sig / latest.json, so nothing unsigned can ever reach the updater.
      #
      # Key rotation: while src-tauri/updater.transition exists, the build signs with the previous key
      # (TAURI_SIGNING_PRIVATE_KEY secret) so installed copies accept the release that carries the new
      # public key. The switch lives here, not on a side branch, because GitHub refuses to publish a
      # release whose commit has workflow files that differ from the default branch.
      - name: Load the updater signing key
        id: sig
        shell: pwsh
        env:
          PASS: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          OLDKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OLDPASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ((Test-Path src-tauri/updater.transition) -and $env:OLDKEY) {
            Write-Host "Signing with the previous key (rotation transition release)"
            "TAURI_SIGNING_PRIVATE_KEY=$($env:OLDKEY.Trim())" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:OLDPASS" >> $env:GITHUB_ENV
            "signed=true" >> $env:GITHUB_OUTPUT
          } elseif ((Test-Path src-tauri/updater.key) -and $env:PASS) {
            "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content src-tauri/updater.key -Raw).Trim())" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:PASS" >> $env:GITHUB_ENV
            "signed=true" >> $env:GITHUB_OUTPUT
          } else { "signed=false" >> $env:GITHUB_OUTPUT }

      # Same command tauri-action runs, but with the compiler's complaints turned into annotations
      # (readable through the public API; the web log viewer needs a login). tauri-action then
      # rebuilds from the warm cache and does the release.
      - name: Compile (errors as annotations)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri build -- ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }} 2>&1 | tee build.log; then
            # strip colour codes, then annotate the compiler errors and the end of the log
            sed -r "s/$(printf '\033')\[[0-9;?]*[ -\/]*[@-~]//g" build.log > plain.log
            { grep -nE "^(error|warning: unused)" -A 14 plain.log | head -160; echo "----- tail -----"; tail -n 70 plain.log; } | paste -sd '|' - | fold -w 1200 | head -10 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi

      # The release body is the annotated tag's message (git tag -a vX.Y.Z -m "what changed"), followed by the
      # install note below. Multiline, so it goes through the GITHUB_OUTPUT heredoc form.
      - name: Release notes from the tag message
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --tags --force || true
          delim="NOTES_$RANDOM$RANDOM"
          {
            echo "body<<$delim"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Build installer (and release on tags)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ steps.sig.outputs.signed == 'true' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Sundial {0}', github.ref_name) || '' }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            **Install**

            - **Windows:** download `Sundial-Setup.exe`. Sundial isn't signed with a paid certificate yet, so Windows doesn't know it. If Edge says the file "isn't commonly downloaded": Keep, then Show more, then Keep anyway. If a blue box says "Windows protected your PC": More info, then Run anyway. No admin password is needed. If Smart App Control blocked it, don't change any settings; that PC needs a signed build.
            - **Fedora, openSUSE and other rpm systems:** `sudo dnf install ./Sundial.rpm` (openSUSE: `sudo zypper install ./Sundial.rpm`).
            - **Ubuntu, Mint, Debian and other deb systems:** `sudo apt install ./Sundial.deb`
            - **Any other Linux** (Arch, CachyOS, Bazzite, SteamOS desktop mode, Fedora Atomic): `chmod +x Sundial.AppImage && ./Sundial.AppImage`

            Updates install on their own on Windows and from the AppImage, which replaces itself in place and restarts. The rpm and deb builds show a Download button that opens this page; install the new file over the old one. The other files here are for the updater and the sync server.
          # Must stay a regular release: GitHub's /releases/latest (the updater endpoint) skips pre-releases.
          prerelease: false

      # A second copy of the installer under a fixed name, so one link always serves the newest build:
      # https://github.com/zphat/Sundial/releases/latest/download/Sundial-Setup.exe
      - name: Copy the installer to Sundial-Setup.exe
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer in src-tauri/target/release/bundle/nsis" }
          Copy-Item $exe.FullName Sundial-Setup.exe
          Write-Host "Copied $($exe.Name) to Sundial-Setup.exe"

      - name: Attach Sundial-Setup.exe to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Sundial-Setup.exe
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: Sundial-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Pin what this build resolved, so releases stop drifting with the day's newest crates.
      - name: Commit Cargo.lock
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then echo "Cargo.lock unchanged"; else git commit -m "Cargo.lock from the CI build [skip ci]" && git push; fi

  # Linux: AppImage (self-updating, any distro), .deb (Ubuntu, Mint, Debian) and .rpm (Fedora, openSUSE), built on
  # Ubuntu 22.04 so the AppImage's WebKitGTK and the glibc floor (2.35) are the oldest still-supported baseline.
  # Runs after 'windows' because both jobs rewrite latest.json on the release (see the header). The Ubuntu 22.04
  # image has brownouts on 2027-03-23, 03-30, 04-06 and 04-13 and is retired on 2027-04-17 (actions/runner-images
  # issue 14254): before then, move to runs-on ubuntu-24.04 with `container: ubuntu:22.04`, or accept the 24.04 floor.
  linux:
    needs: [check, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # The tray library the CLI writes into the deb/rpm dependencies and copies into the AppImage. Ayatana is what
      # Ubuntu, Debian, Fedora and Arch ship; without this the CLI probes pkg-config and would take whichever it finds.
      TAURI_LINUX_AYATANA_APPINDICATOR: "1"
    steps:
      - uses: actions/checkout@v4

      # Tauri 2's list for Debian/Ubuntu, plus: libdbus-1-dev and pkg-config for keyring's Secret Service backend,
      # the GTK/GLib/pixbuf query tools the linuxdeploy gtk plugin calls, desktop-file-utils for appimagetool's
      # desktop file check. libxdo and libssl are not linked by this app (rustls, no linux-libxdo feature) but are
      # kept because Tauri's docs list them and they are cheap.
      - name: Tauri 2 build prerequisites (Ubuntu 22.04)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev pkg-config \
            libglib2.0-bin libgtk-3-bin libgdk-pixbuf2.0-bin desktop-file-utils

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Updates are signed with src-tauri/updater.key, which is stored encrypted (see keygen.yml) and
      # unlocked with the TAURI_UPDATER_KEY_PASSWORD secret. Without both, the build still works but
      # produces no .sig / latest.json, so nothing unsigned can ever reach the updater.
      #
      # Key rotation: while src-tauri/updater.transition exists, the build signs with the previous key
      # (TAURI_SIGNING_PRIVATE_KEY secret) so installed copies accept the release that carries the new
      # public key. The switch lives here, not on a side branch, because GitHub refuses to publish a
      # release whose commit has workflow files that differ from the default branch.
      - name: Load the updater signing key
        id: sig
        shell: pwsh
        env:
          PASS: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
          OLDKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OLDPASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ((Test-Path src-tauri/updater.transition) -and $env:OLDKEY) {
            Write-Host "Signing with the previous key (rotation transition release)"
            "TAURI_SIGNING_PRIVATE_KEY=$($env:OLDKEY.Trim())" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:OLDPASS" >> $env:GITHUB_ENV
            "signed=true" >> $env:GITHUB_OUTPUT
          } elseif ((Test-Path src-tauri/updater.key) -and $env:PASS) {
            "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content src-tauri/updater.key -Raw).Trim())" >> $env:GITHUB_ENV
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:PASS" >> $env:GITHUB_ENV
            "signed=true" >> $env:GITHUB_OUTPUT
          } else { "signed=false" >> $env:GITHUB_OUTPUT }

      # The AppImage runtime. Tauri's bundler runs linuxdeploy with the upstream linuxdeploy-plugin-appimage, whose
      # appimagetool downloads the type 2 runtime from a moving "continuous" tag with no checksum (or, if that plugin
      # download fails, uses whatever older appimagetool is inside linuxdeploy). The plugin passes LDAI_RUNTIME_FILE
      # to appimagetool as --runtime-file, so we pin the static type 2 runtime (FUSE 3, statically linked: it runs
      # on Fedora Atomic desktops and Bazzite, which have no libfuse2). Tag and sha256 move together; the digest is
      # the one GitHub reports for the asset (api.github.com/repos/AppImage/type2-runtime/releases/tags/<tag>).
      - name: AppImage runtime (static type 2, FUSE 3)
        shell: bash
        env:
          TAG: "20251108"
          SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/appimage-runtime"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --retry 3 -o "$dir/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/$TAG/runtime-x86_64"
          echo "$SHA256  $dir/runtime-x86_64" | sha256sum -c -
          echo "LDAI_RUNTIME_FILE=$dir/runtime-x86_64" >> "$GITHUB_ENV"

      # Same command tauri-action runs, but with the compiler's complaints turned into annotations
      # (readable through the public API; the web log viewer needs a login). tauri-action then
      # rebuilds from the warm cache and does the release.
      - name: Compile (errors as annotations)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri build -- --bundles appimage,deb,rpm ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }} 2>&1 | tee build.log; then
            # strip colour codes, then annotate the compiler errors and the end of the log
            sed -r "s/$(printf '\033')\[[0-9;?]*[ -\/]*[@-~]//g" build.log > plain.log
            { grep -nE "^(error|warning: unused)" -A 14 plain.log | head -160; echo "----- tail -----"; tail -n 70 plain.log; } | paste -sd '|' - | fold -w 1200 | head -10 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi

      # Proof that the pin took: a type 2 AppImage whose runtime does not name libfuse.so.2 (the old AppImageKit
      # runtime dlopens it and fails on Fedora Atomic / Bazzite), and that unpacks without FUSE at all.
      - name: Check the AppImage runtime
        shell: bash
        run: |
          set -euo pipefail
          f=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n1)
          [ -n "$f" ] || { echo "::error::no AppImage in src-tauri/target/release/bundle/appimage"; exit 1; }
          chmod +x "$f"
          magic=$(dd if="$f" bs=1 skip=8 count=3 2>/dev/null | od -An -tx1 | tr -d ' \n')
          [ "$magic" = "414902" ] || { echo "::error::$f is not a type 2 AppImage (magic $magic)"; exit 1; }
          off=$("$f" --appimage-offset)
          if head -c "$off" "$f" | grep -aq 'libfuse.so.2'; then
            echo "::error::$f carries the old libfuse2 runtime; LDAI_RUNTIME_FILE was not honoured"; exit 1
          fi
          d=$(mktemp -d)
          (cd "$d" && "$GITHUB_WORKSPACE/$f" --appimage-extract >/dev/null)
          test -x "$d/squashfs-root/usr/bin/sundial"
          echo "AppImage ok: type 2, runtime $off bytes without libfuse2, extracts without FUSE"

      # The release body is the annotated tag's message (git tag -a vX.Y.Z -m "what changed"), followed by the
      # install note below. Multiline, so it goes through the GITHUB_OUTPUT heredoc form.
      - name: Release notes from the tag message
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --tags --force || true
          delim="NOTES_$RANDOM$RANDOM"
          {
            echo "body<<$delim"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # The windows job created the release; this finds it by tag, uploads the AppImage, deb and rpm with their
      # .sig files, and merges linux-x86_64 (AppImage), -appimage, -deb and -rpm into the existing latest.json.
      # The body below must stay identical to the windows job's: tauri-action never rewrites an existing release,
      # and the text is also the "notes" field of latest.json.
      - name: Build bundles (and release on tags)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles appimage,deb,rpm ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ steps.sig.outputs.signed == 'true' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Sundial {0}', github.ref_name) || '' }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            **Install**

            - **Windows:** download `Sundial-Setup.exe`. Sundial isn't signed with a paid certificate yet, so Windows doesn't know it. If Edge says the file "isn't commonly downloaded": Keep, then Show more, then Keep anyway. If a blue box says "Windows protected your PC": More info, then Run anyway. No admin password is needed. If Smart App Control blocked it, don't change any settings; that PC needs a signed build.
            - **Fedora, openSUSE and other rpm systems:** `sudo dnf install ./Sundial.rpm` (openSUSE: `sudo zypper install ./Sundial.rpm`).
            - **Ubuntu, Mint, Debian and other deb systems:** `sudo apt install ./Sundial.deb`
            - **Any other Linux** (Arch, CachyOS, Bazzite, SteamOS desktop mode, Fedora Atomic): `chmod +x Sundial.AppImage && ./Sundial.AppImage`

            Updates install on their own on Windows and from the AppImage, which replaces itself in place and restarts. The rpm and deb builds show a Download button that opens this page; install the new file over the old one. The other files here are for the updater and the sync server.
          # Must stay a regular release: GitHub's /releases/latest (the updater endpoint) skips pre-releases.
          prerelease: false

      # Second copies under fixed names, so one link always serves the newest build:
      # https://github.com/zphat/Sundial/releases/latest/download/Sundial.AppImage (also Sundial.deb, Sundial.rpm)
      - name: Copy the bundles to Sundial.AppImage, Sundial.deb and Sundial.rpm
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          b=src-tauri/target/release/bundle
          cp "$(find $b/appimage -maxdepth 1 -name '*.AppImage' | head -n1)" Sundial.AppImage
          cp "$(find $b/deb -maxdepth 1 -name '*.deb' | head -n1)" Sundial.deb
          cp "$(find $b/rpm -maxdepth 1 -name '*.rpm' | head -n1)" Sundial.rpm
          ls -l Sundial.AppImage Sundial.deb Sundial.rpm

      - name: Attach Sundial.AppImage, Sundial.deb and Sundial.rpm to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Sundial.AppImage
            Sundial.deb
            Sundial.rpm
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: Sundial-linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # No Cargo.lock commit here. The windows job commits it: Cargo.lock lists every platform's crates whatever
      # host resolved it, so Linux-only dependency changes reach the file through that one commit, and a second
      # pusher would only race it.

  # The sync server: a Linux binary on every push, attached to the release on tags.
  sync-server:
    needs: check
    runs-on: ubuntu-24.04   # the hosted box runs Ubuntu 24.04; a binary built on a newer glibc would not start there
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --release --manifest-path server/Cargo.toml 2>&1 | tee build.log; then
            # surface the compiler's complaints as annotations (readable through the public API)
            grep -nE "^(error|warning: unused)" -A 14 build.log | head -160 | paste -sd '|' - | fold -w 1200 | head -8 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi
      - name: Smoke test (self mode)
        run: |
          SUNDIAL_TOKENS=smoke SUNDIAL_DB=/tmp/smoke.sqlite SUNDIAL_BIND=127.0.0.1:8768 ./server/target/release/sundial-sync &
          sleep 1
          curl -fsS http://127.0.0.1:8768/v1/health
          curl -fsS -H 'Authorization: Bearer smoke' http://127.0.0.1:8768/v1/account
          curl -fsS -H 'Authorization: Bearer smoke' -H 'content-type: application/json' -d '{"protocol":1,"device_id":"ci","cursor":0,"docs":[{"id":"t1","kind":"task","updated_at":1,"deleted":false,"nonce":"AAAA","ct":"AAAA"}]}' http://127.0.0.1:8768/v1/sync
          kill %1
      - name: Package
        run: |
          mkdir -p dist && cp server/target/release/sundial-sync dist/sundial-sync-linux-x86_64 && cp server/README.md dist/
          tar -C dist -czf sundial-sync-linux-x86_64.tar.gz sundial-sync-linux-x86_64 README.md
      - uses: actions/upload-artifact@v4
        with:
          name: sundial-sync-linux-x86_64
          path: sundial-sync-linux-x86_64.tar.gz

  # The web bundle for app.sundial.services: ui/ as it is, minus the two desktop-only windows, with the
  # version stamped in. The VPS timer (server/ops/web/sundial-web-update) installs it from the release.
  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the web bundle
        shell: bash
        run: |
          set -euo pipefail
          VER=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          echo "version $VER"
          rm -rf dist-web
          mkdir dist-web
          cp -r ui/. dist-web/
          rm -f dist-web/toast.html dist-web/sundial.html
          if [ -f dist-web/sw.js ]; then
            sed -i "s/__VERSION__/$VER/g" dist-web/sw.js
            grep -qF "$VER" dist-web/sw.js
          fi
          # index.html must already carry the tag; never ship an unstamped page
          if ! grep -Eq '<meta name="sundial-version" content="[^"]*" */?>' dist-web/index.html; then
            echo '::error file=ui/index.html::missing <meta name="sundial-version" content="..."> tag'
            exit 1
          fi
          sed -i -E "s|<meta name=\"sundial-version\" content=\"[^\"]*\" */?>|<meta name=\"sundial-version\" content=\"$VER\">|" dist-web/index.html
          grep -F "<meta name=\"sundial-version\" content=\"$VER\">" dist-web/index.html
          tar -C dist-web -czf sundial-web.tar.gz .
          tar -tzf sundial-web.tar.gz | sort
      - uses: actions/upload-artifact@v4
        with:
          name: sundial-web
          path: sundial-web.tar.gz
          if-no-files-found: error

  # Attaches the server and web tarballs only once the Windows and Linux jobs have published their bundles and
  # latest.json: a release must never exist without latest.json, or every installed copy's update check breaks.
  attach-assets:
    if: github.ref_type == 'tag'
    needs: [windows, linux, sync-server, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sundial-sync-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: sundial-web
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            sundial-sync-linux-x86_64.tar.gz
            sundial-web.tar.gz
          fail_on_unmatched_files: true
