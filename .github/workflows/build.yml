# Builds the Windows installer on every push to main (download it from the run's Artifacts),
# and publishes a GitHub Release with the installer attached when a tag like v0.1.0 is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Updates are signed with src-tauri/updater.key, which is stored encrypted (see keygen.yml) and
      # unlocked with the TAURI_UPDATER_KEY_PASSWORD secret. Without both, the build still works but
      # produces no .sig / latest.json, so nothing unsigned can ever reach the updater.
      - name: Load the updater signing key
        id: sig
        shell: pwsh
        env:
          PASS: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          if ((Test-Path src-tauri/updater.key) -and $env:PASS) {
            "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content src-tauri/updater.key -Raw).Trim())" >> $env:GITHUB_ENV
            "signed=true" >> $env:GITHUB_OUTPUT
          } else { "signed=false" >> $env:GITHUB_OUTPUT }

      # Same command tauri-action runs, but with the compiler's complaints turned into annotations
      # (readable through the public API; the web log viewer needs a login). tauri-action then
      # rebuilds from the warm cache and does the release.
      - name: Compile (errors as annotations)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! npm run tauri build -- ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }} 2>&1 | tee build.log; then
            # strip colour codes, then annotate the compiler errors and the end of the log
            sed -r "s/$(printf '\033')\[[0-9;?]*[ -\/]*[@-~]//g" build.log > plain.log
            { grep -nE "^(error|warning: unused)" -A 14 plain.log | head -160; echo "----- tail -----"; tail -n 70 plain.log; } | paste -sd '|' - | fold -w 1200 | head -10 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi

      - name: Build installer (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          args: ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ steps.sig.outputs.signed == 'true' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Sundial {0}', github.ref_name) || '' }}
          releaseBody: "Windows installer. Unsigned for now: if Windows shows 'unrecognized app', choose More info, then Run anyway."
          # Must stay a regular release: GitHub's /releases/latest (the updater endpoint) skips pre-releases.
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: Sundial-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Pin what this build resolved, so releases stop drifting with the day's newest crates.
      - name: Commit Cargo.lock
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then echo "Cargo.lock unchanged"; else git commit -m "Cargo.lock from the CI build [skip ci]" && git push; fi

  # The sync server: a Linux binary on every push, attached to the release on tags.
  sync-server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --release --manifest-path server/Cargo.toml 2>&1 | tee build.log; then
            # surface the compiler's complaints as annotations (readable through the public API)
            grep -nE "^(error|warning: unused)" -A 14 build.log | head -160 | paste -sd '|' - | fold -w 1200 | head -8 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi
      - name: Smoke test (self mode)
        run: |
          SUNDIAL_TOKENS=smoke SUNDIAL_DB=/tmp/smoke.sqlite SUNDIAL_BIND=127.0.0.1:8768 ./server/target/release/sundial-sync &
          sleep 1
          curl -fsS http://127.0.0.1:8768/v1/health
          curl -fsS -H 'Authorization: Bearer smoke' http://127.0.0.1:8768/v1/account
          curl -fsS -H 'Authorization: Bearer smoke' -H 'content-type: application/json' -d '{"protocol":1,"device_id":"ci","cursor":0,"docs":[{"id":"t1","kind":"task","updated_at":1,"deleted":false,"nonce":"AAAA","ct":"AAAA"}]}' http://127.0.0.1:8768/v1/sync
          kill %1
      - name: Package
        run: |
          mkdir -p dist && cp server/target/release/sundial-sync dist/sundial-sync-linux-x86_64 && cp server/README.md dist/
          tar -C dist -czf sundial-sync-linux-x86_64.tar.gz sundial-sync-linux-x86_64 README.md
      - uses: actions/upload-artifact@v4
        with:
          name: sundial-sync-linux-x86_64
          path: sundial-sync-linux-x86_64.tar.gz

  # Attaches the server tarball only once the Windows job has published the installer: a release must never
  # exist without latest.json, or every installed copy's update check breaks.
  attach-server:
    if: github.ref_type == 'tag'
    needs: [windows, sync-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sundial-sync-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: sundial-sync-linux-x86_64.tar.gz
