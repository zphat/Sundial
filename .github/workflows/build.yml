# Builds the Windows installer on every push to main (download it from the run's Artifacts),
# and publishes a GitHub Release with the installer attached when a tag like v0.1.0 is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Updater artifacts (.sig + latest.json) are produced only when the signing key secret exists,
      # so the build keeps working before the key is set up.
      - name: Detect updater signing key
        id: sig
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:KEY) { "signed=true" >> $env:GITHUB_OUTPUT } else { "signed=false" >> $env:GITHUB_OUTPUT }

      - name: Build installer (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ steps.sig.outputs.signed == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          includeUpdaterJson: ${{ steps.sig.outputs.signed == 'true' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Sundial {0}', github.ref_name) || '' }}
          releaseBody: "Windows installer. Unsigned for now: if Windows shows 'unrecognized app', choose More info, then Run anyway."
          # Must stay a regular release: GitHub's /releases/latest (the updater endpoint) skips pre-releases.
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: Sundial-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
