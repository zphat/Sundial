# One-time: generates the updater signing keypair. Runs when the `.keygen` file changes (or by hand).
# The PUBLIC key is committed to src-tauri/updater.pub. The PRIVATE key is only uploaded as a run
# artifact (visible to repo collaborators only) so it can be pasted into the TAURI_SIGNING_PRIVATE_KEY secret.
name: keygen

on:
  push:
    branches: [main]   # paths filters are ignored on tag pushes; without this, every release tag re-ran keygen
    paths: [".keygen"]
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Generate keypair
        run: npx tauri signer generate -w "$RUNNER_TEMP/sundial-updater.key" --password "" --ci

      - name: Commit the public key
        run: |
          cp "$RUNNER_TEMP/sundial-updater.key.pub" src-tauri/updater.pub
          echo "Public key:"; cat src-tauri/updater.pub; echo
          git config user.name "sundial-bot"
          git config user.email "sundial-bot@users.noreply.github.com"
          git add src-tauri/updater.pub
          git commit -m "Updater public key [skip ci]" || echo "public key unchanged"
          git push

      - name: Upload the private key (collaborators only)
        uses: actions/upload-artifact@v4
        with:
          name: sundial-updater-private-key
          path: ${{ runner.temp }}/sundial-updater.key
          retention-days: 7
